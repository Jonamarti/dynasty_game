name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it half-published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm 10.9.2 can crash in its resolver (see README); the retry with the
      # legacy resolver is the escape hatch.
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      # Same flags as the full check: the default 5 s per-test timeout is too
      # short for the whole-world save/load tests on a GitHub runner.
      # Node 22 for the same reason as ci.yml (pinned fingerprints).
      - name: Unit tests
        run: npm test -- --maxWorkers=1 --testTimeout=15000

      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
