name: Deploy to GitHub Pages
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'master'
    runs-on: ubuntu-latest
    outputs:
      verified_sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Authorize exact CI commit and global verdict
        id: verify
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner, repo = context.repo.repo;
            if (run.repository?.full_name !== owner + '/' + repo ||
                run.head_repository?.full_name !== owner + '/' + repo ||
                run.name !== 'CI' || run.event !== 'push' ||
                run.head_branch !== 'master' || run.conclusion !== 'success' ||
                !/^[0-9a-f]{40}$/i.test(run.head_sha)) {
              core.setFailed('CI event/repository/branch/SHA not authorized');
              return;
            }
            const { data: master } = await github.rest.repos.getBranch({owner, repo, branch:'master'});
            if (master.commit.sha !== run.head_sha) {
              core.setFailed('Master advanced since this CI run');
              return;
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              owner, repo, run_id:run.id, attempt_number:run.run_attempt, per_page:100
            });
            const verdicts = jobs.filter(j => j.name === 'Full verification verdict');
            if (verdicts.length !== 1 || verdicts[0].conclusion !== 'success') {
              core.setFailed('Exactly one successful global verdict is required');
              return;
            }
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner, repo, run_id:run.id, per_page:100
            });
            const expected = 'ci-global-verdict-' + run.run_attempt;
            if (artifacts.filter(a => a.name === expected && !a.expired).length !== 1) {
              core.setFailed('Unique global-verdict artifact for this attempt missing');
              return;
            }
            core.setOutput('sha',run.head_sha);
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Build the exact verified revision
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject superseded master before publishing
        uses: actions/github-script@v7
        env:
          VERIFIED_SHA: ${{ needs.build.outputs.verified_sha }}
        with:
          script: |
            const {data} = await github.rest.repos.getBranch({
              owner:context.repo.owner,repo:context.repo.repo,branch:'master'
            });
            if (data.commit.sha !== process.env.VERIFIED_SHA) {
              core.setFailed('Master changed after build; refusing stale deploy');
            }
      - id: deployment
        uses: actions/deploy-pages@v4
