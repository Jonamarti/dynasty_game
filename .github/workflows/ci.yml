name: CI

# Two levels, following the test pyramid:
#   - every push to any branch      -> fast gate (typecheck + check:fast + build), a few minutes
#   - every pull request to master  -> everything `npm run check:full` runs locally
#     (unit, scenario matrix with --slow, Playwright e2e), split into parallel jobs
#     so it runs in GitHub's CPU, not ours, and finishes sooner than the serial run.
# The full suite can also be launched by hand from the Actions tab (workflow_dispatch).

on:
  push:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same branch/PR cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Node 24 ships npm 11, which is past the npm 10.9.2 crash documented in
      # the README. The retry is the escape hatch if it turns up anyway.
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Typecheck + fast tests
        run: npm run check:fast
      - name: Build
        run: npx vite build

  unit:
    name: Unit + build
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      # Same flags as the `unit` step of tools/check-full-runner.ts.
      - name: Unit tests
        run: npm test -- --maxWorkers=1 --testTimeout=15000
      - name: Build
        run: npx vite build

  matrix:
    name: Scenario matrix ${{ matrix.shard }}/4
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Scenarios (shard ${{ matrix.shard }}/4)
        run: npm run sim:check:all -- --slow --shard ${{ matrix.shard }}/4

  e2e:
    name: E2E ${{ matrix.shard }}/4
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (shard ${{ matrix.shard }}/4)
        run: npm run e2e -- --shard=${{ matrix.shard }}/4 --reporter=github,list
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: artifacts/playwright
          retention-days: 7
