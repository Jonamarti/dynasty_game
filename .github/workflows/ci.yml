name: CI

# Two levels, following the test pyramid:
#   - every push to a work branch   -> fast gate (typecheck + check:fast + build), a few minutes
#   - every pull request to master, and every push to master itself (agents
#     integrate there directly) -> everything `npm run check:full` runs locally
#     (unit, scenario matrix with --slow, Playwright e2e), split into parallel jobs
#     so it runs in GitHub's CPU, not ours, and finishes sooner than the serial run.
# The full suite can also be launched by hand from the Actions tab (workflow_dispatch).
#
# Node is pinned to 22 on purpose, not left at "latest". The simulation's pinned
# fingerprints (fixtures/switches-off.json) and the matrix baseline were taken on
# the owner's machine, and Node 24's V8 rounds `x ** y` for fractional y
# differently in the last bit: the initial forest (`rng.range(0, 1) ** 0.7` in
# ForestSystem.seedInitialForest) gets 104 tree ages one ULP apart and every
# seeded world diverges from there. Moving CI to a newer Node is a world change:
# re-pin and re-baseline in the same commit.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same branch/PR cancels the run it makes obsolete.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast:
    name: Fast gate
    if: github.event_name == 'push' && github.ref != 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # npm 10.9.2 can crash in its resolver (see README); the retry with the
      # legacy resolver is the escape hatch.
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Typecheck + fast tests
        run: npm run check:fast
      - name: Build
        run: npx vite build

  contract:
    name: CI contract
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify global verdict negative cases
        run: node --test tools/ci-full-verdict.test.mjs

  unit:
    name: Unit + build
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Typecheck
        run: npm run typecheck
      # Same flags as the `unit` step of tools/check-full-runner.ts.
      - name: Unit tests
        run: npm test -- --maxWorkers=1 --testTimeout=15000
      - name: Build
        run: npx vite build
      - name: Record verified unit proof
        run: node tools/ci-full-verdict.mjs write unit
      - name: Upload verified unit proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-unit
          path: ci-gate-proofs/unit.json
          if-no-files-found: error

  matrix:
    name: Scenario matrix ${{ matrix.shard }}/4
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      # The inherited matrix is red on purpose (M16 rule R21: "done" means no new
      # failure, not a green matrix). So a failing check is not the verdict; a
      # check that passed in fixtures/matrix-baseline.json and now fails (or goes
      # n/a) is. Re-pin that file when a phase moves the baseline on purpose.
      - name: Scenarios (shard ${{ matrix.shard }}/4)
        run: |
          set +e
          npm run sim:check:all -- --slow --shard ${{ matrix.shard }}/4 --json matrix-shard.json
          code=$?
          set -e
          # 1 = some inherited reds; anything above is a crash or a usage error.
          if [ "$code" -gt 1 ]; then exit "$code"; fi
      - name: Compare with the baseline
        run: npm run baseline:diff -- fixtures/matrix-baseline.json matrix-shard.json --shard ${{ matrix.shard }}/4
      - name: Record verified scenario proof
        run: node tools/ci-full-verdict.mjs write matrix ${{ matrix.shard }}
      - name: Upload verified scenario proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-matrix-${{ matrix.shard }}
          path: ci-gate-proofs/matrix-${{ matrix.shard }}.json
          if-no-files-found: error

  e2e:
    name: E2E ${{ matrix.shard }}/4
    if: github.event_name != 'push' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci || npm ci --legacy-peer-deps
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Playwright (shard ${{ matrix.shard }}/4)
        run: npm run e2e -- --shard=${{ matrix.shard }}/4 --reporter=github,list
      - name: Record verified E2E proof
        run: node tools/ci-full-verdict.mjs write e2e ${{ matrix.shard }}
      - name: Upload verified E2E proof
        uses: actions/upload-artifact@v4
        with:
          name: ci-gate-e2e-${{ matrix.shard }}
          path: ci-gate-proofs/e2e-${{ matrix.shard }}.json
          if-no-files-found: error
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-shard-${{ matrix.shard }}
          path: artifacts/playwright
          retention-days: 7

  verdict:
    name: Full verification verdict
    if: always() && (github.event_name != 'push' || github.ref == 'refs/heads/master')
    needs: [contract, unit, matrix, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: Download all CI proofs
        if: needs.contract.result == 'success' && needs.unit.result == 'success' && needs.matrix.result == 'success' && needs.e2e.result == 'success'
        uses: actions/download-artifact@v4
        with:
          pattern: ci-gate-*
          path: ci-proof-downloads
          merge-multiple: true
      - name: Verify required jobs and every shard
        env:
          CI_CONTRACT_RESULT: ${{ needs.contract.result }}
          CI_UNIT_RESULT: ${{ needs.unit.result }}
          CI_MATRIX_RESULT: ${{ needs.matrix.result }}
          CI_E2E_RESULT: ${{ needs.e2e.result }}
        run: node tools/ci-full-verdict.mjs verify ci-proof-downloads
      - name: Publish global verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-global-verdict
          path: ci-global-verdict.json
          if-no-files-found: warn
