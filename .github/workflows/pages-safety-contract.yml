name: Pages safety contract
on:
  pull_request:
  push:
    branches: [master]
permissions:
  contents: read
jobs:
  check-pages-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Verify Pages cannot publish unchecked
        run: node --test tools/pages-workflow-safety.test.mjs
