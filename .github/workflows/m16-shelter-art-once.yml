# One-time asset generation for the stacked M16 shelter PRs.
# Remove this workflow after the generated files land on the branch.
name: M16 shelter atlas regeneration
on:
  push:
    branches:
      - codex/m16-14-6-mud-hut-rebalance
    paths:
      - .github/workflows/m16-shelter-art-once.yml

permissions:
  contents: write

concurrency:
  group: m16-shelter-art-once
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: codex/m16-14-6-mud-hut-rebalance
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci || npm ci --legacy-peer-deps
      - name: Install Chromium for generated art
        run: npx playwright install --with-deps chromium
      - name: Regenerate only building sheets and manifest
        run: npm run art:build -- buildings
      - name: Typecheck generated project
        run: npm run typecheck
      - name: Validate new generated art against source
        run: npm test -- --maxWorkers=1 --testTimeout=15000 src/render/__tests__/art.test.ts
      # 14.6 final fixture check: distinguish actual room tiles from perimeter wall.
      - name: Verify shelter, interior, and furnishings (focused)
        run: |
          npm test -- --maxWorkers=1 --testTimeout=15000 \
            src/sim/__tests__/m16-shelter-ladder-order.test.ts \
            src/sim/__tests__/house-interior.test.ts \
            src/sim/__tests__/house-interior-lifecycle.test.ts \
            src/sim/__tests__/indoor-preserving.test.ts \
            src/sim/__tests__/furniture-sleep.test.ts \
            src/sim/__tests__/m16-occupancy.test.ts \
            src/sim/__tests__/m16-lean-to.test.ts
      - name: Render art contact sheets for visual review
        run: npm run art:sheet
      - name: Upload building contact sheet
        uses: actions/upload-artifact@v4
        with:
          name: m16-14-6-building-contact
          path: artifacts/art/contact-buildings.png
          retention-days: 7
      - name: Report band scenario health (CI perf threshold is environment-dependent)
        continue-on-error: true
        run: npm run sim:check -- --scenario band
      - name: Commit generated building art to the phase branch
        env:
          BRANCH: codex/m16-14-6-mud-hut-rebalance
        run: |
          git add public/art/buildings.json public/art/buildings-*.png
          if git diff --cached --quiet; then
            echo "No generated changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "art: regenerate M16 lean-to and 3x3 mud-hut building atlas"
          git push origin HEAD:refs/heads/"$BRANCH"

  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/m16-14-6-mud-hut-rebalance
      - uses: actions/checkout@v4
        with:
          ref: codex/m16-14-5-lean-to
          path: before
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci || npm ci --legacy-peer-deps
      - name: Measure band before and after on one runner
        shell: bash
        run: |
          ln -s "$GITHUB_WORKSPACE/node_modules" "$GITHUB_WORKSPACE/before/node_modules"
          set +e
          (cd before && npm run sim:check -- --scenario band) > before-band.log 2>&1
          before_status=$?
          npm run sim:check -- --scenario band > after-band.log 2>&1
          after_status=$?
          set -e
          echo "PREVIOUS 14.5 exit: $before_status"
          grep -E 'CHECKS FAILED|CHECKS PASSED|ai-uses-many-actions|people-survive|shelter-answers-cold|perf-budget|buildings-start-small|BUILDINGS' before-band.log | tail -n 15 || true
          echo "NEW 14.6 exit: $after_status"
          grep -E 'CHECKS FAILED|CHECKS PASSED|ai-uses-many-actions|people-survive|shelter-answers-cold|perf-budget|buildings-start-small|BUILDINGS' after-band.log | tail -n 15 || true
          if [ "$before_status" -ne 0 ] || [ "$after_status" -ne 0 ]; then
            echo "::warning::Scenario health has red gates. Inspect uploaded logs; do not treat this comparison as a passing world gate."
          fi
      - name: Upload reproducible paired band logs
        uses: actions/upload-artifact@v4
        with:
          name: m16-14-6-band-before-after
          path: |
            before-band.log
            after-band.log
          retention-days: 7
